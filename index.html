<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ULTIMATE IP OSINT - MrKarthickR</title><style>*{box-sizing:border-box}body{margin:0;background:#05070a;color:#cbd5e1;font-family:monospace;display:flex;justify-content:center;padding:15px}.box{width:100%;max-width:600px;background:#12151f;border:1px solid #1e293b;border-radius:16px;padding:20px}h1{text-align:center;color:#38bdf8}input{width:100%;padding:14px;background:#02040a;border:1px solid #38bdf8;border-radius:10px;color:#fff}button{width:100%;margin-top:12px;padding:14px;border:none;border-radius:10px;background:#38bdf8;color:#000;font-weight:900}#out{margin-top:16px;background:#02040a;border:1px solid #1e293b;border-radius:12px;padding:14px;display:none;white-space:pre-wrap;word-break:break-all}a{color:#38bdf8;display:block;margin-top:6px}.footer{margin-top:18px;padding-top:12px;border-top:1px solid #1e293b;text-align:center;font-size:11px;color:#94a3b8}.footer b{color:#38bdf8}iframe{width:100%;height:220px;border:0;border-radius:10px;margin-top:10px}</style></head><body><div class="box"><h1>ULTIMATE IP OSINT</h1><p style="text-align:center;font-size:11px;color:#64748b">Website IP • Phone IP • Domain</p><input id="target" placeholder="Enter IP or Domain" value="8.8.8.8"><button onclick="start()">⚡ TRACE NOW</button><div id="out"></div><div class="footer"><b>Web tool Dev: MrKarthickR</b><br>Tg: @Drak24Evil | Insta: mr_rkarthik<br>Team: Telugu Hackers Group<br>Mail: cybercimeinvestigationagent@gmail.com</div></div><script>async function start(){let i=document.getElementById('target').value.trim(),o=document.getElementById('out');o.style.display='block';o.innerHTML='🔍 Tracing...';try{let r=await fetch(`https://ipwho.is/${i}`),d=await r.json();if(!d.success){o.innerHTML='❌ '+d.message;return}o.innerHTML=`<b>IP:</b> ${d.ip}\n<b>Country:</b> ${d.country} ${d.flag?.emoji||''}\n<b>State:</b> ${d.region}\n<b>City:</b> ${d.city}\n<b>Lat/Lon:</b> ${
