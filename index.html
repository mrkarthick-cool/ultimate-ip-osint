<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ULTIMATE IP OSINT - MrKarthickR</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#020617;color:white;font-family:Arial,sans-serif;text-align:center;padding:20px;min-height:100vh}
h1{margin-top:60px;font-size:26px;line-height:1.2}
.sub{color:#94a3b8;font-size:14px;margin:10px;line-height:1.4}
.search-box{border:2px solid #00d9ff;border-radius:50px;display:flex;padding:5px;margin:30px 0;background:#0f172a;overflow:hidden}
.search-box input{flex:1;background:transparent;border:none;color:white;padding:15px;outline:none;font-size:15px}
.search-box button{background:#00d9ff;border:none;border-radius:50px;padding:10px 28px;font-weight:bold;cursor:pointer}
.error{background:#0f172a;border:1px solid #334155;border-radius:20px;padding:15px;margin-top:20px;text-align:left;color:#94a3b8}
.footer{margin-top:40px;color:#64748b;font-size:13px}
.footer a{color:#00d9ff;text-decoration:none}

/* POPUP */
#th-popup-overlay{
 position:fixed;top:0;left:0;width:100%;height:100%;
 background:rgba(2,6,23,0.92);backdrop-filter:blur(12px);
 display:none;justify-content:center;align-items:center;
 z-index:999999;padding:20px;
}
#th-popup-box{
 background:#0f172a;border:2px solid #00d9ff;
 box-shadow:0 0 40px rgba(0,217,255,0.5);border-radius:22px;
 padding:28px;width:100%;max-width:360px;
}
#th-popup-box h2{margin:0 0 10px 0;font-size:22px}
#th-popup-box p{color:#94a3b8;font-size:14px;margin:0;line-height:1.5}
#th-join-btn{
 background:#00d9ff;color:#000;border:none;
 padding:14px;width:100%;border-radius:30px;
 font-weight:800;font-size:16px;margin-top:20px;cursor:pointer;
}
#th-count{color:#00d9ff;margin-top:12px;display:block;font-size:13px;min-height:16px}
#th-close{margin-top:14px;background:transparent;color:#64748b;border:none;font-size:14px;cursor:pointer;padding:5px}
</style>
</head>
<body>

<!-- POPUP -->
<div id="th-popup-overlay">
  <div id="th-popup-box">
    <div style="font-size:30px">🔥</div>
    <h2>Telugu Hackers Group</h2>
    <p>Join 400+ Ethical Hackers<br>Daily Tools & Tricks</p>
    <button id="th-join-btn">Join Group ⚡</button>
    <span id="th-count"></span>
    <br><button id="th-close"><p><b> <a href="https://t.me/teluguhackersgroup1">Skip for now ⏭️</a>  </p> </b> </button>
  </div>
</div>

<h1>🕵️ ULTIMATE iP OSINT 🕵️</h1>
<div class="sub">Expand Short URLs • Preview Real Destination • Block Phishing • IP Trace • 👨‍💻 Team Work</div>

<div class="search-box">
<input type="text" placeholder="Enter link - google.com / bit.ly/xyz">
<button>EnT3r ⚡</button>
</div>

<div class="error">❌ Please Enter URL</div>

<div class="footer">👾 Dev: MrKarthickR | V3</div>

<script>
// 1. CHECK - User already joined chusaara?
window.onload = function(){
  let alreadyJoined = localStorage.getItem('th_joined');
  if(!alreadyJoined){
    document.getElementById('th-popup-overlay').style.display = 'flex';
  }
}

// 2. JOIN LOGIC - 3 Sec trick
document.getElementById('th-join-btn').addEventListener('click', function(){
  let btn = this;
  let countEl = document.getElementById('th-count');
  let overlay = document.getElementById('th-popup-overlay');
  let time = 3;
  
  // META DATA SAVE - ip base laga work avutundi
  localStorage.setItem('th_joined', 'true');
  localStorage.setItem('th_join_time', new Date().toISOString());

  btn.disabled = true;
  countEl.innerText = `Opening Telegram in ${time}s...`;
  
  let timer = setInterval(()=>{
    time--;
    if(time > 0){
      countEl.innerText = `Redirecting in ${time}s...`;
      btn.innerText = `${time}...`;
    } else {
      clearInterval(timer);
      overlay.style.display = 'none';
      // NEE GROUP LINK
      window.open("https://t.me/TeluguHackersGroup", "_blank");
      // Optional: 1 sec tarvata home page refresh
      setTimeout(()=>{ window.location.href = window.location.href; }, 500);
    }
  },1000);
});

// Skip button kuda save chestadi - malli popup radu
document.getElementById('th-close').addEventListener('click', function(){
  localStorage.setItem('th_joined', 'skipped');
  document.getElementById('th-popup-overlay').style.display='none';
});
</script>

</body>
</html>
