<script>
const GROUP_LINK = "https://t.me/teluguhackersgroup1"; // <-- NEE ORIGINAL LINK IKADA PETTU

// FIXED OPEN FUNCTION - ALL BROWSER SUPPORT
function openTelegramLink(){
  // Method works even on file:// and old browsers
  window.location.href = GROUP_LINK;
}

// ON LOAD - CHECK IF ALREADY JOINED
window.addEventListener('DOMContentLoaded', function(){
  let joined = localStorage.getItem('th_joined');
  if(!joined){
    document.getElementById('th-popup-overlay').style.display = 'flex';
  }
});

// JOIN BUTTON - 3 SEC LOGIC
document.getElementById('th-join-btn').addEventListener('click', function(){
  let btn = this;
  let countEl = document.getElementById('th-count');
  let overlay = document.getElementById('th-popup-overlay');
  let time = 3;

  // SAVE META DATA - Malli popup raakudadu
  try{
    localStorage.setItem('th_joined', 'true');
    localStorage.setItem('th_join_time', Date.now().toString());
  }catch(e){}

  btn.disabled = true;
  btn.style.opacity = "0.7";
  
  countEl.innerText = "Opening Telegram in 3s...";
  btn.innerText = "Wait 3...";

  let timer = setInterval(function(){
    time--;
    if(time > 0){
      countEl.innerText = "Opening Telegram in " + time + "s...";
      btn.innerText = "Wait " + time + "...";
    } else {
      clearInterval(timer);
      countEl.innerText = "Redirecting...";
      overlay.style.display = 'none';
      // DIRECT REDIRECT - NO POPUP BLOCK
      openTelegramLink();
    }
  }, 1000);
});
