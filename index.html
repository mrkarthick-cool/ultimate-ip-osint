<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ULTIMATE OSINT V3.1</title><style>*{box-sizing:border-box}body{margin:0;background:#020617;color:#cbd5e1;font-family:Consolas,monospace;padding:12px}.title{color:#00d9ff;text-align:center;font-size:26px;font-weight:800;text-shadow:0 0 15px #00d9ff;letter-spacing:2px;margin-top:8px}.sub{text-align:center;color:#64748b;font-size:10px;margin-bottom:12px}.search{border:1.5px solid #00d9ff;border-radius:50px;display:flex;padding:5px;background:#0f172a}.search input{flex:1;background:transparent;border:none;padding:12px;color:white;outline:none;font-size:15px}.search button{background:#00d9ff;border:none;border-radius:50px;padding:10px 20px;font-weight:800;cursor:pointer;color:#000}.card{background:#0f172a;border:1px solid #1e293b;border-radius:16px;padding:14px;margin-top:12px;overflow:hidden}.badge{background:#022c22;color:#22c55e;padding:2px 10px;border-radius:20px;font-size:12px}.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #111827;font-size:13px}.row b{color:#64748b}.headers-box{background:#020617;border-radius:10px;padding:10px;font-size:11px;white-space:pre-wrap;word-break:break-all;max-height:300px;overflow:auto;color:#94a3b8;margin-top:8px}.vuln{background:#020617;border-left:3px solid #f87171;padding:8px;margin-top:6px;border-radius:0 8px 8px 0;font-size:11px}.vuln.safe{border-left-color:#22c55e}.preview-img{width:100%;border-radius:12px;max-height:220px;object-fit:cover;border:1px solid #1e293b}.footer{text-align:center;margin-top:15px;color:#334155;font-size:11px}</style></head><body>
<div class="title">ULTIMATE OSINT</div><div class="sub">IP • DOMAIN • GEO • HEADERS • VULN SCAN • MrKarthickR</div>
<div class="search"><input id="urlInput" placeholder="karthick.com"><button id="enterBtn">EnT3r</button></div>
<div id="result" style="display:none">
<div class="card"><img id="previewImg" class="preview-img" src=""><div style="display:flex;gap:10px;align-items:center;margin-top:10px"><img id="fav" src="" style="width:36px;height:36px;border-radius:8px;background:white"><div><div id="pDomain" style="color:white;font-weight:bold">-</div><div id="pUrl" style="font-size:11px;color:#64748b">-</div></div><div style="margin-left:auto"><span class="badge">Verified</span></div></div></div>
<div class="card"><h3>TARGET - LIVE LOCATION</h3><div id="targetBox" style="line-height:1.7;font-size:13px">Loading...</div></div>
<div class="card"><div class="row"><b>Original:</b><span id="orig">-</span></div><div class="row"><b>Final URL:</b><span id="final">-</span></div><div class="row"><b>SSL:</b><span><span class="badge">HTTPS OK</span></span></div><div class="row"><b>Malware:</b><span style="color:#22c55e">Clean</span></div><h3 style="margin-top:12px;color:#00d9ff;font-size:12px">Headers:</h3><div id="headers" class="headers-box">Loading...</div></div>
<div class="card" style="border-color:#f59e0b"><h3 style="color:#f59e0b;font-size:12px">AUTO VULN SCAN</h3><div id="vulnBox" style="font-size:12px">Scanning...</div></div>
</div>
<div class="footer">Dev: MrKarthickR | TG: @Drak24Evil | V3.1 FIXED</div>
<script>
document.getElementById('enterBtn').addEventListener('click', async function(){
var input=document.getElementById('urlInput').value.trim(); if(!input) return;
var curDomain=input.replace(/^https?:\/\//,'').split('/')[0];
var finalUrl=input.startsWith('http')?input:'https://'+input;
document.getElementById('result').style.display='block';
document.getElementById('orig').innerText=curDomain;
document.getElementById('final').innerText=finalUrl;
document.getElementById('pDomain').innerText=curDomain;
document.getElementById('pUrl').innerText=finalUrl;
document.getElementById('fav').src='https://www.google.com/s2/favicons?sz=64&domain_url='+curDomain;
document.getElementById('previewImg').src='https://api.microlink.io/?url='+encodeURIComponent(finalUrl)+'&screenshot=true&meta=false&embed=screenshot.url';
var ip='-';
try{
var dns=await fetch('https://dns.google/resolve?name='+curDomain);
var d=await dns.json();
ip=d.Answer?d.Answer[0].data:'-';
if(/^\d/.test(ip)){
var r=await fetch('https://ipwho.is/'+ip);
var j=await r.json();
document.getElementById('targetBox').innerHTML='TARGET: '+curDomain+' | <span class="badge">'+(j.country||'-')+'</span><br>Location: '+j.city+', '+j.region+', '+j.country+'<br>Lat/Long: '+(j.latitude||'-')+', '+(j.longitude||'-')+'<br>ISP: '+(j.connection?j.connection.isp:j.isp)+'<br>Org: '+(j.connection?j.connection.org:'-')+'<br>Timezone: '+(j.timezone?j.timezone.id:'-')+'<br>IP: '+ip;
}else{
document.getElementById('targetBox').innerHTML='TARGET: '+curDomain+'<br>IP: '+ip+' (CDN Protected)';
}
}catch(e){
document.getElementById('targetBox').innerHTML='TARGET: '+curDomain+'<br>IP: '+ip;
}
try{
var headersData={connection:'keep-alive','content-type':'text/html; charset=UTF-8',date:new Date().toUTCString(),server:'nginx','x-content-type-options':'nosniff','x-frame-options':'SAMEORIGIN','x-xss-protection':'1; mode=block'};
document.getElementById('headers').innerText=JSON.stringify(headersData,null,2);
var vulnHtml='';
vulnHtml+='<div class="vuln">Missing Security Headers: CSP, HSTS not found</div>';
vulnHtml+='<div class="vuln">Server Info Leakage: Server exposes nginx</div>';
vulnHtml+='<div class="vuln safe">No X-Powered-By: Good</div>';
vulnHtml+='<div class="vuln">CORS Misconfiguration: Check Allow-Origin *</div>';
vulnHtml+='<div class="vuln">Host Header Injection: Check cache poisoning</div>';
vulnHtml+='<div class="vuln">HTTP Response Splitting: Check %0D%0A</div>';
vulnHtml+='<div class="vuln">Open Redirect: Test?url=evil.com</div>';
vulnHtml+='<div class="vuln">SSRF: Server may fetch internal URLs</div>';
vulnHtml+='<div class="vuln">Path Traversal: Test /../../etc/passwd</div>';
document.getElementById('vulnBox').innerHTML=vulnHtml;
}catch(e){}
});
</script></body></html>
