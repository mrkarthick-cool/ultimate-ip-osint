<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ULTIMATE OSINT - MrKarthickR</title>
<style>
body{background:#0a0e13;color:#e6e6e6;font-family:monospace;padding:10px}
.card{background:#111a24;border:1px solid #1e3a5f;border-radius:12px;padding:18px;max-width:650px;margin:auto}
h1{color:#00d4ff;text-align:center;margin:5px;letter-spacing:3px;text-shadow:0 0 10px #00d4ff}
.sub{text-align:center;color:#888;font-size:11px;margin-bottom:15px}
input{width:100%;padding:13px;border-radius:8px;border:1px solid #00d4ff;background:#0a0e13;color:#fff;box-sizing:border-box}
button{width:100%;padding:13px;margin-top:10px;border-radius:8px;border:none;background:#00d4ff;color:#000;font-weight:900;cursor:pointer}
.box{background:#0a0e13;border:1px solid #222;border-radius:8px;padding:10px;margin-top:12px;font-size:12px;white-space:pre-wrap;word-break:break-all}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;margin:2px}
.ok{background:#003d1f;color:#00ff88} .warn{background:#3d1a00;color:#ff9d00} .bad{background:#3d0000;color:#ff4444}
iframe{width:100%;height:400px;border:1px solid #333;border-radius:8px;background:#fff;margin-top:10px}
.footer{text-align:center;color:#555;font-size:10px;margin-top:15px;border-top:1px solid #222;padding-top:10px}
.footer b{color:#00d4ff}
</style></head><body>
<div class="card">
<h1>ULTIMATE OSINT</h1>
<div class="sub">IP • DOMAIN • PREVIEW • REDIRECT • MALWARE SCAN • MrKarthickR</div>
<input id="t" placeholder="Enter google.com / 8.8.8.8 / https://...">
<button onclick="go()">⚡ POWER TRACE</button>
<div id="out"></div>
<div class="footer"><b>Dev: MrKarthickR</b> @Drak24Evil | Telugu Hackers Group</div>
</div>
<script>
async function go(){
 const v=document.getElementById('t').value.trim();
 const o=document.getElementById('out');
 if(!v){o.innerHTML='<div class=box>❌ Enter target</div>';return}
 o.innerHTML='<div class=box>⏳ Scanning IP + Preview + Redirects + Malware...</div>';
 try{
  const [ipRes, preRes] = await Promise.all([
   fetch(`/api?key=THG-DEV-MrKarthickR-2026&target=${encodeURIComponent(v)}`).then(r=>r.json()),
   fetch(`/api/preview?url=${encodeURIComponent(v)}`).then(r=>r.json()).catch(()=>({error:'preview fail'}))
  ]);
  let html=`<div class=box>`;
  html+=`<span class=badge ok>TARGET: ${ipRes.target||v}</span> <span class=badge ok>${ipRes.location||''}</span><br><br>`;
  html+=`📍 <b>Location:</b> ${ipRes.location||'N/A'}<br>🏢 <b>ISP:</b> ${ipRes.isp||'N/A'}<br>🏛️ <b>Org:</b> ${ipRes.org||'N/A'}<br>🌐 <b>Lat/Lon:</b> ${ipRes.lat}, ${ipRes.lon}<br>`;
  html+=`</div>`;

  if(preRes.finalUrl){
   html+=`<div class=box>`;
   html+=`🔗 <b>Original:</b> ${preRes.original}<br>➡️ <b>Final URL:</b> ${preRes.finalUrl}<br>📄 <b>Title:</b> ${preRes.title}<br>`;
   html+=`🔒 <b>SSL:</b> ${preRes.ssl?'<span class=badge ok>HTTPS OK</span>':'<span class=badge bad>NO SSL</span>'} `;
   html+=`🛡️ <b>Malware:</b> ${preRes.malwareSuspect?'<span class=badge bad>SUSPECT ⚠️</span>':'<span class=badge ok>CLEAN ✅</span>'}<br><br>`;
   html+=`<b>↪️ Redirect Chain (${preRes.redirects.length}):</b><br>${preRes.redirects.map((r,i)=>`${i+1}. [${r.status}] ${r.url}`).join('<br>')}<br><br>`;
   html+=`<b>Headers:</b><br>${JSON.stringify(preRes.headers,null,2).substring(0,800)}`;
   html+=`</div>`;
   html+=`<div class=box><b>👁️ HTML Preview (Safe Sandbox):</b><br>`;
   html+=`<iframe sandbox="allow-scripts" srcdoc="${preRes.htmlPreview.replace(/"/g,'&quot;')}"></iframe>`;
   html+=`<br><br><b>Source (first 2000 chars):</b><br><div style="background:#000;padding:5px;max-height:200px;overflow:auto">${preRes.htmlPreview.substring(0,2000).replace(/</g,'&lt;')}</div></div>`;
  }
  o.innerHTML=html;
 }catch(e){o.innerHTML='<div class=box>❌ '+e.message+'</div>'}
}
</script></body></html>
