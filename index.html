<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ULTIMATE OSINT - MrKarthickR</title>
<style>
body{background:#0a0e13;color:#e6e6e6;font-family:monospace;padding:10px}
.card{background:#111a24;border:1px solid #1e3a5f;border-radius:12px;padding:18px;max-width:650px;margin:0 auto}
h1{color:#00d4ff;text-align:center;margin:5px;letter-spacing:3px;text-shadow:0 0 10px #00d4ff}
.sub{text-align:center;color:#888;font-size:11px;margin-bottom:15px}
input{width:100%;padding:13px;border-radius:8px;border:1px solid #00d4ff;background:#0a0e13;color:#fff;box-sizing:border-box}
button{width:100%;padding:13px;margin-top:10px;border-radius:8px;border:none;background:#00d4ff;color:#000;font-weight:bold;cursor:pointer}
.box{background:#0a0e13;border:1px solid #222;border-radius:8px;padding:10px;margin-top:12px;font-size:11px;word-break:break-all}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;margin:2px}
.ok{background:#003d1f;color:#00ff88}.warn{background:#3d1a00;color:#ff9d00}.bad{background:#3d0000;color:#ff4444}
iframe{width:100%;height:400px;border:1px solid #333;border-radius:8px;background:#fff;margin-top:8px}
.footer{text-align:center;color:#555;font-size:10px;margin-top:15px;border-top:1px solid #222;padding-top:10px}
.footer b{color:#00d4ff}
</style></head>
<body>
<div class="card">
<h1>ULTIMATE OSINT</h1>
<div class="sub">IP • DOMAIN • PREVIEW • REDIRECT • MALWARE SCAN • MrKarthickR</div>
<input id="t" placeholder="Enter google.com / 8.8.8.8 / https://...">
<button onclick="go()">⚡ POWER TRACE</button>
<div id="out"></div>
<div class="footer"><b>Dev: MrKarthickR</b> @Drak24Evil | Telugu Hackers Group</div>
</div>
<script>
async function go(){
const v=document.getElementById('t').value.trim();
const o=document.getElementById('out');
if(!v){o.innerHTML='<div class=box>❌ Enter target</div>';return}
o.innerHTML='<div class=box>⏳ Scanning IP + Preview + Redirects + Malware...</div>';
try{
  const safeJson = async (url) => {
    const r = await fetch(url);
    const txt = await r.text();
    try { return JSON.parse(txt); }
    catch { return {finalUrl:v, original:v, htmlPreview:txt.slice(0,1000), status:500, ssl:false, headers:{}, redirects:[], malwareSuspect:false, target:v, location:'Blocked / N/A', isp:'N/A', loc:'N/A'}; }
  };
  const [ipRes, preRes] = await Promise.all([
    safeJson(`/api?key=THG-DEV-MrKarthickR-2026&target=${encodeURIComponent(v)}`),
    safeJson(`/api/preview?url=${encodeURIComponent(v)}`)
  ]);
  let html='<div class=box>🎯 TARGET: '+(ipRes.target||v)+' | <span class="badge ok">'+(ipRes.loc||'N/A')+'</span><br>📍 <b>Location:</b> '+(ipRes.location||'N/A')+'<br>🏢 <b>ISP:</b> '+(ipRes.isp||'N/A')+'<br>🌐 <b>IP:</b> '+(ipRes.ip||'N/A')+'</div>';
  html+='<div class=box>🔗 <b>Original:</b> '+(preRes.original||v)+'<br>➡️ <b>Final URL:</b> '+(preRes.finalUrl||'N/A')+'<br>🔒 <b>SSL:</b> '+(preRes.ssl?'<span class="badge ok">HTTPS OK</span>':'<span class="badge bad">NO SSL</span>')+'<br>🛡️ <b>Malware:</b> '+(preRes.malwareSuspect?'<span class=badge bad>SUSPECT ⚠️</span>':'<span class=badge ok>Clean</span>')+'<br><br><b>Headers:</b><br>'+JSON.stringify(preRes.headers||{},null,2).substring(0,800)+'</div>';
  const safeHtml = (preRes.htmlPreview||'').substring(0,30000);
html+=`<div class=box>👁️ <b>HTML Preview:</b>
<div style="background:#fff;color:#000;border-radius:8px;padding:10px;max-height:500px;overflow:auto;margin-top:8px">${safeHtml.replace(/</g,'&lt;').substring(0,5000)}</div>
<br><b>Open Live:</b> <a href="${preRes.finalUrl}" target="_blank" style="color:#00d4ff">${preRes.finalUrl}</a>
<br><br><button onclick="window.open('${preRes.finalUrl}','_blank')" style="background:#fff;color:#000">🔗 Open Site in New Tab</button>
</div>`;
  o.innerHTML=html;
}catch(e){o.innerHTML='<div class=box>❌ '+e.message+'</div>'}
}
</script></body></html>
